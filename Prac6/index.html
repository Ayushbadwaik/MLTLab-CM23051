<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Pose Detection</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:linear-gradient(135deg,#eaf4ff,#d8ebff);
font-family:Poppins;
min-height:100vh;
overflow:hidden;
}

#bgCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.header{
text-align:center;
padding-top:20px;
margin-bottom:20px;
}

.header h1{
font-family:Montserrat;
font-size:40px;
color:#1a2b4c;
}

.name{
color:#2f6fe4;
font-weight:600;
font-size:18px;
margin-top:5px;
}

.main{
display:flex;
gap:40px;
width:95%;
max-width:1500px;
margin:auto;
}

.left{
width:350px;
background:white;
border-radius:15px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #cfe0ff;
background:#f5f9ff;
}

button{
margin-top:12px;
width:100%;
padding:12px;
background:#4a8cff;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2f6fe4;
transform:translateY(-2px);
}

.result{
margin-top:20px;
font-size:18px;
font-weight:500;
}

.highlight{
color:#2f6fe4;
font-weight:600;
}

.bars{
margin-top:20px;
}

.label{
font-size:13px;
margin-bottom:4px;
}

.bar{
height:16px;
background:#e8f0ff;
border-radius:10px;
overflow:hidden;
margin-bottom:12px;
}

.fill{
height:100%;
width:0%;
background:#4a8cff;
transition:width 1s;
}

.right{
flex:1;
background:white;
border-radius:15px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
display:flex;
justify-content:center;
align-items:center;
min-height:650px;
}

canvas{
width:100%;
max-height:80vh;
border-radius:10px;
}

video{
display:none;
}

</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div class="header">
<h1>Pose Detection (Human Stand/Sit)</h1>
<div class="name">Ayush D. Badwaik CM23051</div>
</div>

<div class="main">

<div class="left">

<input type="file" id="upload" accept="image/*">

<button onclick="predictImage()">Analyze Image</button>

<button onclick="startWebcam()">Use Webcam</button>

<div class="result" id="prediction">Prediction: -</div>

<div class="bars">

<div class="label">Standing</div>
<div class="bar"><div id="barStanding" class="fill"></div></div>

<div class="label">Sitting</div>
<div class="bar"><div id="barSitting" class="fill"></div></div>

</div>

</div>

<div class="right">
<canvas id="canvas"></canvas>
<video id="webcam" autoplay playsinline></video>
</div>

</div>

<script>

/* ---------- MODEL ---------- */

const URL="./";

let model;
let image=new Image();

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

let video=document.getElementById("webcam");

async function init(){

const modelURL=URL+"model.json";
const metadataURL=URL+"metadata.json";

model=await tmPose.load(modelURL,metadataURL);

}

init();

/* ---------- IMAGE UPLOAD ---------- */

document.getElementById("upload").addEventListener("change",function(e){

const file=e.target.files[0];
const reader=new FileReader();

reader.onload=function(event){

video.style.display="none";
canvas.style.display="block";

image.src=event.target.result;

image.onload=function(){

canvas.width=image.width;
canvas.height=image.height;

ctx.drawImage(image,0,0);

}

}

reader.readAsDataURL(file);

});

async function predictImage(){

if(!image.src){
alert("Please upload an image first.");
return;
}

const {pose,posenetOutput}=await model.estimatePose(image);

const prediction=await model.predict(posenetOutput);

updatePrediction(prediction);

if(pose){
tmPose.drawKeypoints(pose.keypoints,0.5,ctx);
tmPose.drawSkeleton(pose.keypoints,0.5,ctx);
}

}

/* ---------- WEBCAM ---------- */

let webcamRunning=false;

async function startWebcam(){

canvas.style.display="block";
video.style.display="none";

const stream=await navigator.mediaDevices.getUserMedia({
video:{width:640,height:480}
});

video.srcObject=stream;

webcamRunning=true;

video.onloadeddata=()=>{
predictWebcam();
};

}

async function predictWebcam(){

if(!webcamRunning) return;

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

ctx.drawImage(video,0,0,canvas.width,canvas.height);

const {pose,posenetOutput}=await model.estimatePose(canvas);

const prediction=await model.predict(posenetOutput);

updatePrediction(prediction);

if(pose){
tmPose.drawKeypoints(pose.keypoints,0.5,ctx);
tmPose.drawSkeleton(pose.keypoints,0.5,ctx);
}

requestAnimationFrame(predictWebcam);

}

/* ---------- UPDATE UI ---------- */

function updatePrediction(prediction){

let standing=0;
let sitting=0;

prediction.forEach(p=>{

if(p.className.toLowerCase().includes("standing"))
standing=p.probability;

if(p.className.toLowerCase().includes("sitting"))
sitting=p.probability;

});

let label=standing>sitting?"Standing":"Sitting";
let confidence=Math.max(standing,sitting);

document.getElementById("prediction").innerHTML=
'Prediction: <span class="highlight">'+label+' ('+(confidence*100).toFixed(2)+'%)</span>';

document.getElementById("barStanding").style.width=(standing*100)+"%";
document.getElementById("barSitting").style.width=(sitting*100)+"%";

}

/* ---------- BACKGROUND SKELETON ANIMATION ---------- */

const bgCanvas=document.getElementById("bgCanvas");
const bgCtx=bgCanvas.getContext("2d");

bgCanvas.width=window.innerWidth;
bgCanvas.height=window.innerHeight;

let skeletons=[];

for(let i=0;i<8;i++){
skeletons.push({
x:Math.random()*window.innerWidth,
y:Math.random()*window.innerHeight,
speed:0.4+Math.random()
});
}

function drawStick(x,y){

bgCtx.strokeStyle="rgba(47,111,228,0.25)";
bgCtx.lineWidth=3;

bgCtx.beginPath();

bgCtx.arc(x,y-40,10,0,Math.PI*2);

bgCtx.moveTo(x,y-30);
bgCtx.lineTo(x,y);

bgCtx.moveTo(x,y-20);
bgCtx.lineTo(x-20,y-5);

bgCtx.moveTo(x,y-20);
bgCtx.lineTo(x+20,y-5);

bgCtx.moveTo(x,y);
bgCtx.lineTo(x-15,y+30);

bgCtx.moveTo(x,y);
bgCtx.lineTo(x+15,y+30);

bgCtx.stroke();

}

function animate(){

bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);

skeletons.forEach(s=>{

s.x+=s.speed;

if(s.x>bgCanvas.width+50){
s.x=-50;
s.y=Math.random()*bgCanvas.height;
}

drawStick(s.x,s.y);

});

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
