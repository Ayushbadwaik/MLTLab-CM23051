<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎥 Real-time Webcam Object Detection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: #1e293b;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        
        h1 {
            text-align: center;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .webcam-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }
        
        .webcam-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.4);
        }
        
        .webcam-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .pause-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }
        
        .pause-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(245, 158, 11, 0.4);
        }
        
        .confidence-slider {
            width: 200px;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
            margin-left: 12px;
        }
        
        .confidence-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
        }
        
        .confidence-value {
            font-weight: 600;
            color: #059669;
            margin-left: 12px;
        }
        
        .webcam-container {
            position: relative;
            max-width: 640px;
            margin: 0 auto 40px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.2);
        }
        
        #video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .detection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .detection-box {
            position: absolute;
            border: 3px solid #10b981;
            background: rgba(16, 185, 129, 0.1);
            transition: all 0.2s ease;
        }
        
        .detection-label {
            position: absolute;
            background: #10b981;
            color: white;
            padding: 6px 12px;
            border-radius: 6px 6px 0 0;
            font-size: 14px;
            font-weight: 600;
            top: -3px;
            left: 8px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        
        .stats {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            margin-top: 24px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #10b981;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 80px;
            color: #64748b;
        }
        
        .spinner {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #ef4444;
            border-radius: 50%;
            width: 64px;
            height: 64px;
            animation: spin 1s linear infinite;
            margin: 0 auto 32px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container { padding: 20px 16px; }
            .card { padding: 32px 24px; }
            h1 { font-size: 2.2rem; }
            .controls { flex-direction: column; align-items: center; }
            .webcam-container { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Real-time Object Detection<br>Ayush D. Badwaik [CM23051]</h1>
            <p class="subtitle">Hold objects in front of your webcam - detects 80+ COCO classes in real-time using TensorFlow.js</p>
            
            <div class="controls">
                <button id="webcamButton" class="btn webcam-btn">🎥 Enable Webcam</button>
                <button id="pauseButton" class="btn pause-btn" style="display: none;">⏸️ Pause Detection</button>
                <div style="display: flex; align-items: center; gap: 8px; font-weight: 600;">
                    Min Confidence:
                    <input type="range" id="confidenceSlider" class="confidence-slider" min="0.1" max="0.9" step="0.1" value="0.5">
                    <span id="confidenceValue" class="confidence-value">50%</span>
                </div>
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                Loading COCO-SSD Object Detection Model...
            </div>
            
            <div class="webcam-container" style="display: none;" id="webcamContainer">
                <video id="video" autoplay muted playsinline></video>
                <canvas class="detection-overlay" id="overlay"></canvas>
            </div>
            
            <div class="stats" id="stats" style="display: none;">
                <div class="stats-grid">
                    <div class="stat-item">
                        <div id="objectsDetected" class="stat-value">0</div>
                        <div class="stat-label">Objects Detected</div>
                    </div>
                    <div class="stat-item">
                        <div id="fpsCounter" class="stat-value">0</div>
                        <div class="stat-label">FPS</div>
                    </div>
                    <div class="stat-item">
                        <div id="totalPredictions" class="stat-value">0</div>
                        <div class="stat-label">Total Predictions</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let model = null;
        let video = null;
        let canvas = null;
        let ctx = null;
        let isDetecting = false;
        let animationId = null;
        let lastTimestamp = 0;
        let frameCount = 0;
        let totalPredictions = 0;
        
        const webcamButton = document.getElementById('webcamButton');
        const pauseButton = document.getElementById('pauseButton');
        const confidenceSlider = document.getElementById('confidenceSlider');
        const confidenceValue = document.getElementById('confidenceValue');
        const loading = document.getElementById('loading');
        const webcamContainer = document.getElementById('webcamContainer');
        const overlay = document.getElementById('overlay');
        const stats = document.getElementById('stats');
        const objectsDetectedEl = document.getElementById('objectsDetected');
        const fpsCounterEl = document.getElementById('fpsCounter');
        const totalPredictionsEl = document.getElementById('totalPredictions');
        
        let minConfidence = 0.5;
        
        // Load COCO-SSD model
        async function loadModel() {
            try {
                console.log('Loading COCO-SSD model...');
                model = await cocoSsd.load();
                console.log('✅ COCO-SSD loaded successfully!');
                loading.style.display = 'none';
                webcamButton.disabled = false;
            } catch (error) {
                console.error('❌ Failed to load model:', error);
                loading.innerHTML = '<div class="spinner"></div>Failed to load model. Please refresh.';
            }
        }
        
        // Setup webcam
        async function setupWebcam() {
            video = document.getElementById('video');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        width: 640,
                        height: 480,
                        facingMode: 'user'
                    }
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    webcamContainer.style.display = 'block';
                    webcamButton.style.display = 'none';
                    pauseButton.style.display = 'inline-flex';
                    stats.style.display = 'block';
                    canvas = document.getElementById('overlay');
                    ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    startDetection();
                };
            } catch (error) {
                console.error('❌ Webcam access denied:', error);
                alert('Could not access webcam. Please allow camera access.');
            }
        }
        
        // Start real-time detection
        function startDetection() {
            isDetecting = true;
            detectFrame();
        }
        
        // Single frame detection
        async function detectFrame() {
            if (!isDetecting || !model || !video || video.paused || video.ended) {
                requestAnimationFrame(detectFrame);
                return;
            }
            
            const timestamp = performance.now();
            const predictions = await model.detect(video);
            totalPredictions += predictions.length;
            
            renderPredictions(predictions);
            updateStats(predictions.length, timestamp);
            
            animationId = requestAnimationFrame(detectFrame);
        }
        
        // Render bounding boxes and labels
        function renderPredictions(predictions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const validPredictions = predictions.filter(p => p.score > minConfidence);
            
            validPredictions.forEach((prediction, index) => {
                const [x, y, width, height] = prediction.bbox;
                
                // Draw bounding box
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);
                
                // Draw label background
                ctx.fillStyle = 'rgba(16, 185, 129, 0.9)';
                ctx.fillRect(x, y - 25, Math.max(100, prediction.class.length * 20), 25);
                
                // Draw label text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(
                    `${prediction.class} ${(prediction.score * 100).toFixed(1)}%`, 
                    x + 8, 
                    y - 6
                );
            });
        }
        
        // Update statistics
        function updateStats(numObjects, timestamp) {
            frameCount++;
            if (timestamp - lastTimestamp >= 1000) {
                const fps = frameCount * 1000 / (timestamp - lastTimestamp);
                fpsCounterEl.textContent = Math.round(fps);
                frameCount = 0;
                lastTimestamp = timestamp;
            }
            
            objectsDetectedEl.textContent = numObjects;
            totalPredictionsEl.textContent = totalPredictions.toLocaleString();
        }
        
        // Event listeners
        webcamButton.addEventListener('click', setupWebcam);
        
        pauseButton.addEventListener('click', () => {
            isDetecting = !isDetecting;
            pauseButton.textContent = isDetecting ? '⏸️ Pause Detection' : '▶️ Resume Detection';
        });
        
        confidenceSlider.addEventListener('input', (e) => {
            minConfidence = parseFloat(e.target.value);
            confidenceValue.textContent = Math.round(minConfidence * 100) + '%';
        });
        
        confidenceValue.textContent = Math.round(minConfidence * 100) + '%';
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
        
        // Initialize
        loadModel();
    </script>
</body>
</html>
