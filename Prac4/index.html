<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Image Classification</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Inter',sans-serif;
background:linear-gradient(135deg,#eef2ff,#f8fafc);
color:#1f2937;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
}

header{
text-align:center;
margin-top:35px;
margin-bottom:30px;
}

.title{
font-size:34px;
font-weight:700;
color:#1e3a8a;
letter-spacing:-0.5px;
}

.subtitle{
font-size:15px;
color:#64748b;
margin-top:6px;
}

.container{
width:92%;
max-width:1150px;
display:grid;
grid-template-columns:1fr 1fr;
gap:28px;
}

@media(max-width:900px){
.container{grid-template-columns:1fr}
}

.card{
background:white;
border-radius:16px;
padding:26px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
transition:0.3s ease;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 16px 40px rgba(0,0,0,0.12);
}

.card-title{
font-size:20px;
font-weight:600;
margin-bottom:14px;
color:#334155;
}

.upload{
border:2px dashed #cbd5e1;
border-radius:12px;
padding:28px;
text-align:center;
cursor:pointer;
color:#64748b;
transition:0.25s;
font-size:14px;
}

.upload:hover{
background:#f1f5f9;
border-color:#94a3b8;
}

.preview{
margin-top:18px;
width:100%;
border-radius:10px;
}

button{
margin-top:15px;
padding:11px 20px;
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
font-size:14px;
color:white;
transition:0.25s;
}

.btn-green{
background:#22c55e;
}

.btn-green:hover{
background:#16a34a;
}

.btn-purple{
background:#6366f1;
}

.btn-purple:hover{
background:#4f46e5;
}

.status{
font-size:13px;
margin-top:8px;
color:#64748b;
}

.results{
margin-top:16px;
}

.row{
background:#f8fafc;
padding:10px;
border-radius:8px;
margin-top:10px;
transition:0.2s;
}

.row:hover{
background:#f1f5f9;
}

.bar{
height:10px;
border-radius:6px;
margin-top:6px;
transition:width 0.8s ease;
}

.spinner{
border:3px solid #e5e7eb;
border-top:3px solid #6366f1;
border-radius:50%;
width:22px;
height:22px;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
0%{transform:rotate(0)}
100%{transform:rotate(360deg)}
}

footer{
margin-top:40px;
margin-bottom:25px;
font-size:12px;
color:#94a3b8;
}

</style>
</head>

<body>

<header>
<div class="title">Image Classification Demo</div>
<div class="subtitle">Ayush Badwaik [CM23051]</div>
</header>

<div class="container">

<div class="card">

<div class="card-title">MobileNet (Pretrained)</div>

<div class="upload" id="upload1">
Click or drag an image here
<input type="file" id="file1" hidden>
</div>

<img id="preview1" class="preview">

<button id="analyze1" class="btn-green" disabled>Analyze Image</button>

<div id="status1" class="status">Loading MobileNet...</div>

<div id="results1" class="results"></div>

</div>


<div class="card">

<div class="card-title">Custom Model</div>

<div class="upload" id="upload2">
Click or drag an image here
<input type="file" id="file2" hidden>
</div>

<img id="preview2" class="preview">

<button id="analyze2" class="btn-purple" disabled>Analyze Image</button>

<div id="status2" class="status">Loading model...</div>

<div id="results2" class="results"></div>

</div>

</div>

<footer>
TensorFlow.js Image Classification
</footer>

<script>

let mobilenetModel
let customModel
let metadata

async function loadModels(){

await tf.setBackend("cpu")
await tf.ready()

console.log("TensorFlow backend:",tf.getBackend())

mobilenetModel=await mobilenet.load()

document.getElementById("status1").innerText="MobileNet ready"

metadata=await fetch("metadata.json").then(r=>r.json())

customModel=await tf.loadLayersModel("model.json")

console.log("MODEL LOADED SUCCESSFULLY")

document.getElementById("status2").innerText="Custom model ready"

}

window.onload=loadModels


function setupUpload(uploadId,fileId,previewId,buttonId){

const upload=document.getElementById(uploadId)
const file=document.getElementById(fileId)
const preview=document.getElementById(previewId)
const button=document.getElementById(buttonId)

upload.onclick=()=>file.click()

upload.ondragover=e=>e.preventDefault()

upload.ondrop=e=>{
e.preventDefault()
file.files=e.dataTransfer.files
showPreview()
}

file.onchange=showPreview

function showPreview(){

const reader=new FileReader()

reader.onload=e=>{
preview.src=e.target.result
button.disabled=false
}

reader.readAsDataURL(file.files[0])

}

}

setupUpload("upload1","file1","preview1","analyze1")
setupUpload("upload2","file2","preview2","analyze2")


function displayResults(results,container,color){

container.innerHTML=""

results.forEach((r,i)=>{

const row=document.createElement("div")
row.className="row"

const label=document.createElement("div")
label.innerText=`${i+1}. ${r.className} — ${(r.probability*100).toFixed(2)}%`

const bar=document.createElement("div")
bar.className="bar"
bar.style.width=(r.probability*100)+"%"
bar.style.background=color

row.appendChild(label)
row.appendChild(bar)

container.appendChild(row)

})

}



document.getElementById("analyze1").onclick=async()=>{

const img=document.getElementById("preview1")

document.getElementById("results1").innerHTML='<div class="spinner"></div>'

const predictions=await mobilenetModel.classify(img)

displayResults(predictions.slice(0,5),
document.getElementById("results1"),
"#22c55e")

}



document.getElementById("analyze2").onclick=async()=>{

const img=document.getElementById("preview2")

document.getElementById("results2").innerHTML='<div class="spinner"></div>'

const scores=tf.tidy(()=>{

let tensor=tf.browser.fromPixels(img,3)

tensor=tf.image.resizeBilinear(tensor,[224,224])

tensor=tensor.toFloat()

tensor=tensor.div(127.5).sub(1)

tensor=tensor.expandDims(0)

const prediction=customModel.predict(tensor)

return prediction.dataSync()

})

let results=[]

for(let i=0;i<scores.length;i++){

results.push({
className:metadata.labels[i],
probability:scores[i]
})

}

results.sort((a,b)=>b.probability-a.probability)

displayResults(results.slice(0,5),
document.getElementById("results2"),
"#6366f1")

}

</script>

</body>
</html>
