<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digit Recognition Control Board</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">

<style>
/* ===== BACKGROUND ===== */
body{
  margin:0;
  overflow:hidden;
  font-family:Times New Roman, sans-serif;
  background:#eef6ff;
}

.bg{
  position:fixed;
  inset:0;
  z-index:-1;
}

.bg span{
  position:absolute;
  top:-10%;
  font-size:36px;
  font-weight:bold;
  animation:fall linear infinite;
}

@keyframes fall{
  to{ transform:translateY(120vh); }
}

/* ===== APP ===== */
.app{
  width:1550px;
  margin:25px auto;
  background:white;
  border-radius:20px;
  padding:26px;
  box-shadow:0 30px 70px rgba(0,0,0,0.25);
  animation:slideIn 2s ease;
}

@keyframes slideIn{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  text-align:center;
  margin:0 0 20px;
}

/* ===== TOOLBAR ===== */
.toolbar{
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:16px;
}

.tool{
  display:flex;
  flex-direction:column;
  align-items:center;
}

button, select{
  padding:14px 20px;
  border:none;
  border-radius:14px;
  font-size:15px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  transition:transform 0.2s, box-shadow 0.2s;
}

button:hover, select:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.pen{background:#2563eb;}
.eraser{background:#dc2626;}
.clear{background:#374151;}
.predict{background:#16a34a;}
.upload{background:#7c3aed;}

/* ===== LED ===== */
.led{
  width:15px;
  height:12px;
  border-radius:50%;
  margin-top:6px;
  background:#444;
  opacity:10;
}

.blink{
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,100%{opacity:0;}
  50%{opacity:1;}
}

/* ===== CANVAS ===== */
.board-wrap{
  display:flex;
  justify-content:center;
}

canvas{
  background:black;
  border-radius:16px;
  border:3px solid #333;
  width:28cm;
  height:13cm;
  box-shadow:0 0 0 transparent;
  transition:box-shadow 0.3s;
}

canvas.active{
  box-shadow:0 0 25px rgba(0,255,0,0.6);
}
/* ===== CHALK CURSOR ===== */
canvas.chalk-cursor{
  cursor: url("data:image/svg+xml;utf8,\
  <svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'>\
    <circle cx='16' cy='16' r='6' fill='white'/>\
    <circle cx='16' cy='16' r='8' fill='rgba(255,255,255,0.3)'/>\
  </svg>") 16 16, auto;
}


canvas.duster-cursor {
  cursor: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'>\
  <circle cx='20' cy='20' r='14' fill='red'/>\
  <circle cx='20' cy='20' r='18' fill='none' stroke='red' stroke-width='2'/>\
</svg>") 20 20, auto;
}



/* ===== RESULT ===== */
.result-card{
  margin-top:22px;
  background:#dbeafe;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

#result{
  font-family:'Seven Segment', sans-serif;
  font-size:68px;
  color:red;
  letter-spacing:10px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="app">
  <h1>Digit Recognition<br>Ayush Badwaik [CM23051] MLTL Prac 2 using MNIST Dataset</h1>

  <div class="toolbar">

    <div class="tool">
      <select id="mode" onchange="changeMode(); activateLED('modeLed')">
        <option value="single">Single Digit</option>
        <option value="multi">Multi Digit (max 5)</option>
      </select>
      <div class="led" id="modeLed" style="background:cyan"></div>
    </div>

    <div class="tool">
      <button class="pen" onclick="setPen(); activateLED('penLed')">Pen</button>
      <div class="led" id="penLed" style="background:blue"></div>
    </div>

    <div class="tool">
     <button class="eraser" onclick="setEraser(); activateLED('eraserLed')">Eraser</button>
      <div class="led" id="eraserLed" style="background:red"></div>
    </div>

    <div class="tool">
      <button class="clear" onclick="clearCanvas(); activateLED('clearLed')">Clear</button>
      <div class="led" id="clearLed" style="background:white"></div>
    </div>

    <div class="tool">
      <button class="predict" onclick="predict(); activateLED('predictLed')">Predict</button>
      <div class="led" id="predictLed" style="background:lime"></div>
    </div>

    <div class="tool">
      <button class="upload" onclick="fileInput.click(); activateLED('uploadLed')">Upload</button>
      <input type="file" id="fileInput" hidden accept="image/*" onchange="loadImage(event)">
      <div class="led" id="uploadLed" style="background:violet"></div>
    </div>

  </div>

  <div class="board-wrap">
    <canvas id="board" width="900" height="400"></canvas>
  </div>

  <div class="result-card">
    <div id="result">----</div>
  </div>
</div>

<script>
/* ===== BACKGROUND NUMBERS ===== */
const bg=document.getElementById("bg");
const colors=["#ff4d4d","#22c55e","#3b82f6","#a855f7","#facc15"];
for(let i=0;i<50;i++){
  const s=document.createElement("span");
  s.innerText=Math.floor(Math.random()*10);
  s.style.left=Math.random()*100+"%";
  s.style.color=colors[Math.floor(Math.random()*colors.length)];
  s.style.animationDuration=5+Math.random()*12+"s";
  bg.appendChild(s);
}

/* ===== LED HANDLER ===== */
function activateLED(id){
  document.querySelectorAll(".led").forEach(l=>l.classList.remove("blink"));
  document.getElementById(id).classList.add("blink");
}
function setPen(){
  tool="pen";
  canvas.classList.remove("duster-cursor");
  canvas.classList.add("chalk-cursor");
}

function setEraser(){
  tool="eraser";
  canvas.classList.remove("chalk-cursor");
  canvas.classList.add("duster-cursor");
}

/* ===== MODEL ===== */
let model;
tf.loadGraphModel("tfjs_model/model.json").then(m=>model=m);

/* ===== CANVAS ===== */
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
ctx.lineCap="round";
ctx.lineWidth=18;

let drawing=false;
let tool="pen";
let mode="single";

function getPos(e){
  const r=canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*(canvas.width/r.width),
    y:(e.clientY-r.top)*(canvas.height/r.height)
  };
}

canvas.onmousedown=e=>{
  drawing=true;
  canvas.classList.add("active");
  const p=getPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
};

canvas.onmouseup=()=>{drawing=false;ctx.beginPath();canvas.classList.remove("active");};

canvas.onmousemove=e=>{
  if(!drawing) return;
  const p=getPos(e);
  ctx.globalCompositeOperation=(tool==="eraser")?"destination-out":"source-over";
  ctx.strokeStyle=(tool==="eraser")?"rgba(0,0,0,1)":"white";
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x,p.y);
};

/* ===== MODE ===== */
function changeMode(){
  mode=document.getElementById("mode").value;
  clearCanvas();
}

function drawPartitions(){
  if(mode!=="multi") return;
  ctx.save();
  ctx.strokeStyle="lime";
  ctx.lineWidth=3;
  ctx.setLineDash([10,8]);
  const w=canvas.width/5;
  for(let i=1;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(i*w,0);
    ctx.lineTo(i*w,canvas.height);
    ctx.stroke();
  }
  ctx.restore();
}

function clearCanvas(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.beginPath();
  drawPartitions();
  document.getElementById("result").innerText="----";
}

/* ===== IMAGE UPLOAD ===== */
function loadImage(e){
  const img=new Image();
  img.onload=()=>{
    clearCanvas();
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
  };
  img.src=URL.createObjectURL(e.target.files[0]);
}

/* ===== PREDICT ===== */
function preprocess(c){
  return tf.tidy(()=>tf.browser.fromPixels(c,1)
    .resizeNearestNeighbor([28,28])
    .toFloat().div(255).expandDims(0));
}

function predict(){
  if(!model) return alert("Model loading...");
  let out="";

  if(mode==="single"){
    const t=preprocess(canvas);
    out=model.predict(t).argMax(-1).dataSync()[0];
    tf.dispose(t);
  }else{
    const w=canvas.width/5;
    for(let i=0;i<5;i++){
      const tmp=document.createElement("canvas");
      tmp.width=w; tmp.height=canvas.height;
      tmp.getContext("2d").drawImage(
        canvas,i*w,0,w,canvas.height,0,0,w,canvas.height
      );
      const t=preprocess(tmp);
      out+=model.predict(t).argMax(-1).dataSync()[0];
      tf.dispose(t);
    }
  }
  document.getElementById("result").innerText=out;
}

clearCanvas();
setPen(); // default chalk cursor

</script>

</body>
</html>
